<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Collective</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  --night:#0F1430; --panel:#161D3E; --line:#2A3463; --text:#E9ECF8; --muted:#8E97C4;
  --work:#4FD1C5; --wait:#F2B84B; --fail:#F07167; --gov:#A78BFA;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 45% 40%,#1A2350 0%,var(--night) 70%);color:var(--text);font:15px/1.45 var(--ui);font-variant-numeric:tabular-nums;overflow:hidden}
a{color:var(--text)}
:focus-visible{outline:2px solid var(--work);outline-offset:2px;border-radius:4px}
/* HUD */
.hud{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:12px 18px;z-index:5;pointer-events:none;flex-wrap:wrap}
.hud > *{pointer-events:auto}
.title{font:700 21px var(--display);margin-right:6px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(22,29,62,.85);border:1px solid var(--line);font:600 14px var(--display);backdrop-filter:blur(6px);text-decoration:none;color:var(--text)}
.pill .sub{font:500 13px var(--ui);color:var(--muted)}
.pill.run{color:var(--work)} .pill.setup{color:var(--gov)} .pill.stop{color:#fff;background:var(--fail);border-color:transparent}
.pill.bad{color:var(--fail)} .pill.ok{color:var(--work)}
.lamp{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.week{display:inline-flex;align-items:center;gap:10px;padding:6px 12px;border-radius:999px;background:rgba(22,29,62,.85);border:1px solid var(--line)}
.week .bar{position:relative;width:220px;height:10px;border-radius:5px;overflow:hidden;background:#232B55}
.week .bar i{position:absolute;top:0;bottom:0}
.week .needle{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;box-shadow:0 0 6px #fff}
.week .lbl{font:600 13px var(--display)} .week .sub{font:500 12.5px var(--ui);color:var(--muted)}
.spacer{flex:1}
/* stage */
.stage{position:fixed;inset:0;right:360px;display:flex;align-items:center;justify-content:center;padding:70px 10px 96px}
svg.world{width:100%;height:100%}
.agent{cursor:pointer;transition:transform 1.2s ease-in-out}
.agent .fig{transform-box:fill-box;transform-origin:center bottom}
@media (prefers-reduced-motion:no-preference){
  .agent.working .fig{animation:bob .9s ease-in-out infinite alternate}
  .agent.working .dots circle{animation:blink 1.2s infinite}
  .agent.working .dots circle:nth-child(2){animation-delay:.2s} .agent.working .dots circle:nth-child(3){animation-delay:.4s}
  .monument .glow{animation:breathe 3s ease-in-out infinite}
}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.85}}
.agent.paused .fig,.agent.never .fig{opacity:.45}
.agent.ghost .fig{opacity:.3}
.agent:hover .ring,.agent.sel .ring{opacity:1}
/* side */
aside{position:fixed;top:0;right:0;bottom:0;width:360px;background:rgba(18,24,52,.94);border-left:1px solid var(--line);padding:70px 18px 18px;overflow:auto;z-index:4}
aside h2{font:600 15px var(--display);color:var(--muted);margin:18px 0 8px;display:flex;justify-content:space-between}
aside h2:first-child{margin-top:0}
aside h2 b{color:var(--text)}
.quest{padding:9px 11px;border-radius:10px;background:rgba(242,184,75,.13);margin-bottom:7px}
.quest .t{font-weight:600;color:var(--wait)} .quest code{font-size:12.5px;opacity:.9;word-break:break-all}
.none{color:var(--muted);font-size:14px}
.profile{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.badge{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.profile .n{font:700 19px var(--display)} .profile .m{color:var(--muted);font-size:13.5px}
.status-line{font-size:14px;margin:4px 0 10px}
.log{list-style:none;margin:0;padding:0;font-size:13.5px}
.log li{display:grid;grid-template-columns:44px 84px 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.log .s{color:#5B659A;font:600 13px var(--display)} .log .a{font:600 13.5px var(--display)} .log .w{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log li.inc .w,.log li.inc .a{color:var(--fail)}
.back{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;font:600 13px var(--display);cursor:pointer;margin-bottom:10px}
/* spawn tray */
.tray{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:14px;
  background:rgba(22,29,62,.9);border:1px solid var(--line);backdrop-filter:blur(6px);flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px)}
.tray .lbl{font:600 13px var(--display);color:var(--muted);margin:0 6px 0 4px}
.cls{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#1B2450;color:var(--text);
  font:600 13.5px var(--display);cursor:pointer}
.cls:hover{border-color:var(--c,#8E97C4);box-shadow:0 0 0 1px var(--c,#8E97C4) inset}
.cls i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;background:color-mix(in srgb,var(--c) 30%,transparent)}
/* wizard */
.modal{position:fixed;inset:0;background:rgba(6,9,24,.62);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.open{display:flex}
.wiz{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#161D3E;border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.wiz h3{font:700 20px var(--display);margin:0 0 2px}
.steps{display:flex;gap:6px;margin:10px 0 16px}
.steps span{flex:1;height:4px;border-radius:2px;background:#2A3463}.steps span.on{background:var(--work)}
.wiz label{display:block;font:600 13.5px var(--display);color:var(--muted);margin:12px 0 5px}
.wiz input,.wiz textarea,.wiz select{width:100%;font:15px var(--ui);padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#0F1430;color:var(--text)}
.wiz textarea{min-height:80px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.choice{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#1B2450;color:var(--text);cursor:pointer;font:14px var(--ui)}
.choice b{display:flex;align-items:center;gap:8px;font:700 15.5px var(--display);margin-bottom:3px}
.choice.sel{border-color:var(--work);box-shadow:0 0 0 1px var(--work) inset}
.choice small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{padding:4px 9px;border-radius:999px;font:600 12.5px var(--display);background:rgba(79,209,197,.14);color:var(--work)}
.chip2.req{background:none;border:1px dashed var(--wait);color:var(--wait)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{font:600 14.5px var(--display);padding:9px 16px;border-radius:10px;border:0;cursor:pointer;background:var(--work);color:#0F1430}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.note2{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.gov{padding:10px 12px;border-radius:10px;background:rgba(167,139,250,.12);font-size:13.5px;margin-top:12px}
.tabs2{display:flex;gap:4px;margin:6px 0 10px}
.tabs2 button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--display);padding:6px 8px;cursor:pointer}
.tabs2 button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;margin:6px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
details.prompt summary{cursor:pointer;color:var(--muted);font:600 13.5px var(--display);margin-top:10px}
details.prompt pre{white-space:pre-wrap;font:13px/1.5 var(--ui);background:#0F1430;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:320px;overflow:auto}
/* conversations on the floor */
.convo{cursor:pointer}
.convo:focus-visible{outline:none}.convo:focus-visible .pill{stroke:#fff;stroke-width:2}
@media (prefers-reduced-motion:no-preference){ .convo.fresh .pill{animation:pop 1.2s ease-out 2} }
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.convo .pill{transform-box:fill-box;transform-origin:center}
/* the chat sheet, in the style of iOS Messages */
.chatwrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,9,24,.55);z-index:30;padding:14px}
.chatwrap.open{display:flex}
.phone{width:min(400px,100%);height:min(760px,calc(100vh - 28px));background:#fff;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 10px #0B0E1F,0 0 0 11px #2A3463;color:#000;
  font:16px/1.32 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;font-variant-numeric:normal}
.ph-head{padding:12px 14px 10px;background:rgba(249,249,249,.94);border-bottom:.5px solid #D1D1D6;text-align:center;position:relative;flex:none}
.ph-back{position:absolute;left:10px;top:24px;background:none;border:0;color:#007AFF;font:17px -apple-system,system-ui,sans-serif;cursor:pointer;padding:4px}
.ph-avatars{display:flex;justify-content:center;margin:2px 0 4px}
.ph-avatars span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:2px solid #F9F9F9;margin-left:-9px}
.ph-avatars span:first-child{margin-left:0}
.ph-title{font-weight:600;font-size:14px;color:#000}
.ph-sub{font-size:12px;color:#8E8E93;margin-top:1px}
.ph-body{flex:1;overflow:auto;padding:10px 12px 14px;background:#fff}
.ph-time{text-align:center;color:#8E8E93;font-size:11.5px;margin:14px 0 6px}
.ph-time b{font-weight:600}
.ph-doing{text-align:center;color:#8E8E93;font-size:12px;margin:6px 24px;line-height:1.35}
.ph-doing b{color:#3A3A3C;font-weight:600}
.ph-name{font-size:11.5px;color:#8E8E93;margin:8px 0 2px 46px}
.ph-row{display:flex;align-items:flex-end;gap:8px;margin:2px 0}
.ph-row .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none}
.ph-row .av.hide{visibility:hidden}
.bub{max-width:74%;padding:8px 12px;border-radius:18px;background:#E9E9EB;color:#000;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.ph-row.last .bub{border-bottom-left-radius:5px}
.ph-row.me{justify-content:flex-end}
.ph-row.me .bub{background:#0A84FF;color:#fff}
.ph-row.me.last .bub{border-bottom-left-radius:18px;border-bottom-right-radius:5px}
.bub.typing{display:inline-flex;gap:4px;padding:12px 14px}
.bub.typing i{width:7px;height:7px;border-radius:50%;background:#8E8E93;display:block}
@media (prefers-reduced-motion:no-preference){ .bub.typing i{animation:tdot 1.3s infinite} .bub.typing i:nth-child(2){animation-delay:.18s} .bub.typing i:nth-child(3){animation-delay:.36s} }
@keyframes tdot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.ph-foot{flex:none;padding:8px 12px 14px;border-top:.5px solid #D1D1D6;background:#F9F9F9;display:flex;gap:8px;align-items:center}
.ph-input{flex:1;border:1px solid #D1D1D6;border-radius:18px;padding:7px 13px;color:#8E8E93;font-size:14px;background:#fff}
.ph-live{font-size:11px;color:#34C759;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.ph-live i{width:6px;height:6px;border-radius:50%;background:#34C759;display:block}
@media (max-width:980px){ html,body{overflow:auto} .stage{position:relative;inset:auto;right:0;height:70vh} aside{position:relative;width:auto;padding-top:18px} }
</style>
</head>
<body>
<div class="hud">
  <span class="title">The Collective</span>
  <span class="pill" id="state"><span class="lamp"></span>Connecting</span>
  <a class="pill" id="seal" href="/records#health">Checking records</a>
  <span class="pill" id="sprint">No sprint yet</span>
  <span class="week" id="week" title="The sprint week"><span class="lbl" id="week-name">…</span><span class="bar" id="week-bar"></span><span class="sub" id="week-left"></span></span>
  <span class="spacer"></span>
  <a class="pill" href="/scope">Scope</a>
  <a class="pill" href="/records">Records</a>
  <a class="pill" href="/history">History</a>
</div>
<div class="stage"><svg class="world" id="world" role="img" aria-labelledby="wt wd"><title id="wt">The Collective's floor</title>
  <desc id="wd">Four rooms around the Record: the Council, the Lab, the Studio, and the Workshop, each with its agents. Speech bubbles show what active agents are doing.</desc></svg>
  <div class="tray" id="tray" aria-label="Spawn a new agent"><span class="lbl">Spawn</span></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="wiz-title"><div class="wiz" id="wiz"></div></div>
<div class="chatwrap" id="chatwrap" role="dialog" aria-modal="true" aria-labelledby="ph-title"><div class="phone" id="phone"></div></div>
<aside id="side" aria-live="polite"></aside>
<script>
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = p => fetch(p, {cache:"no-store"}).then(r => r.json());
const ago = ts => { if(!ts) return "never"; const s=(Date.now()-new Date(ts))/1000;
  return s<60?"just now":s<3600?Math.round(s/60)+" min ago":s<86400?Math.round(s/3600)+" h ago":Math.round(s/86400)+" d ago"; };

// ---------- who they are ----------
const CAST = {
  pm:         {name:"Project Manager", color:"#E9B949", icon:"📋", room:"council", motto:"Keeps the week moving. Chairs the meeting, holds the plan.", votes:true},
  scribe:     {name:"Scribe",          color:"#EFE6CF", icon:"📜", room:"council", motto:"Writes everything down. Files the case law, writes the blog.", votes:false},
  lawyer:     {name:"Lawyer",          color:"#C0506A", icon:"⚖️", room:"council", motto:"Checks every proposal against the Charter and precedent.", votes:false},
  auditor:    {name:"Auditor",         color:"#6CC3A0", icon:"🔍", room:"council", motto:"Trusts nothing unverified. Runs every integrity check.", votes:false},
  researcher: {name:"Researcher",      color:"#5AA9E6", icon:"📚", room:"lab",     motto:"Reads the papers so the Collective doesn't guess.", votes:true},
  ideas:      {name:"Ideas",           color:"#A7D65A", icon:"💡", room:"lab",     motto:"Turns research into things worth building.", votes:true},
  prototyper: {name:"Prototyper",      color:"#9B7BF2", icon:"🔧", room:"workshop",motto:"Builds it, one version at a time.", votes:true},
  media:      {name:"Media",           color:"#F28C4B", icon:"🎥", room:"studio",  motto:"Shows the work: demos, voice, video.", votes:true},
  social:     {name:"Social",          color:"#F271B0", icon:"📣", room:"studio",  motto:"The voice of Verafy on X. Positive, truthful, never spammy.", votes:true},
};
const OTHERS = {steward:"You", system:"System", human:"A human", external:"Outside change"};
const nm = a => CAST[a]?.name || OTHERS[a] || a;

// ---------- the world (isometric tiles) ----------
const TW = 64, TH = 32;
const iso = (x, y, z=0) => ({x: (x - y) * TW/2, y: (x + y) * TH/2 - z});
const svg = $("#world");
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); (parent||svg).appendChild(e); return e; }
const pts = arr => arr.map(p => `${p.x},${p.y}`).join(" ");
const N = 18;   // the floor is N×N tiles: four 6×6 rooms around a 6-wide plaza
const ROOMS = {
  council:  {x:0,  y:0,  w:6, d:6, floor:"#2C2757", edge:"#433B7E", label:"Council"},
  lab:      {x:0,  y:12, w:6, d:6, floor:"#1F3657", edge:"#2F5282", label:"Lab"},
  studio:   {x:12, y:0,  w:6, d:6, floor:"#3A2446", edge:"#5B3668", label:"Studio"},
  workshop: {x:12, y:12, w:6, d:6, floor:"#26334F", edge:"#3A4C73", label:"Workshop"},
};
const HOME = {  // where each agent normally stands (tile coordinates)
  // the Council sits in a diamond around its table, so on screen nobody stands behind anyone
  scribe:{x:1.3,y:1.3}, pm:{x:1.4,y:4.6}, lawyer:{x:4.6,y:1.4}, auditor:{x:5.1,y:5.1},
  researcher:{x:1.4,y:13.6}, ideas:{x:5.6,y:16.4}, media:{x:13.2,y:1.2}, social:{x:16.6,y:5.6}, prototyper:{x:15.2,y:15.6},
};
// during deliberation and voting, everyone meets at the Council table: the four officers sit behind it,
// the five makers in front. Laid out in screen space so nobody overlaps, then converted to tiles.
const MEETING = {};
const toTile = (sx, sy) => ({x:(sx/32 + sy/16)/2, y:(sy/16 - sx/32)/2});
[["lawyer",-150],["pm",-50],["scribe",50],["auditor",150]].forEach(([k, sx]) => MEETING[k] = toTile(sx, 80));
[["social",-220],["media",-110],["prototyper",0],["ideas",110],["researcher",220]].forEach(([k, sx]) => MEETING[k] = toTile(sx, 182));
function meetingSpot(k, i){ return MEETING[k] || toTile(-240 + (i % 6) * 96, 284); }   // voters added later: a third row
const RECORD = {x:9, y:9};
let CLASSES = {};
// agents beyond the founding nine get the nearest free spot in their room, spaced so nobody overlaps on screen
function freeSlot(room, taken){
  const r = ROOMS[room] || ROOMS.lab, cands = [];
  for(let x = r.x+.7; x <= r.x+r.w-.7; x += .5) for(let y = r.y+.7; y <= r.y+r.d-.7; y += .5) cands.push({x, y});
  const c = iso(r.x + r.w/2, r.y + r.d/2);
  cands.sort((a,b) => { const A = iso(a.x,a.y), B = iso(b.x,b.y); return Math.hypot(A.x-c.x,A.y-c.y) - Math.hypot(B.x-c.x,B.y-c.y); });
  for(const p of cands){ const q = iso(p.x, p.y);
    if(taken.every(t => Math.abs(t.x-q.x) >= 80 || Math.abs(t.y-q.y) >= 104)) return p; }
  return cands[0];
}
function adoptRoster(roster){
  for(const a of roster){
    if(a.status === "retired") continue;
    const base = CAST[a.key] || {};
    CAST[a.key] = {...base, name:a.name, color:a.color || base.color || "#8E97C4", icon:a.icon || base.icon || "🤖", room:a.room || base.room || "lab",
      motto:a.motto || base.motto || "", votes:!!a.votes, cls:a.class, status:a.status, motion:a.motion, clone_of:a.clone_of};
    if(!AG[a.key]) makeAgent(a.key);
  }
  // assign spots: founding nine keep theirs; others get the nearest free spot in their room
  const taken = Object.keys(HOME).filter(k => CAST[k] && CAST[k].status !== "retired").map(k => iso(HOME[k].x, HOME[k].y));
  for(const a of roster) if(a.status !== "retired" && !HOME[a.key]){
    HOME[a.key] = freeSlot(CAST[a.key].room, taken); taken.push(iso(HOME[a.key].x, HOME[a.key].y)); }
  for(const k of Object.keys(AG)) if(!roster.find(a => a.key === k && a.status !== "retired")) { AG[k].g.remove(); delete AG[k]; }
}

function tile(x, y, fill, stroke, g){ const a=iso(x,y), b=iso(x+1,y), c=iso(x+1,y+1), d=iso(x,y+1);
  el("polygon", {points:pts([a,b,c,d]), fill, stroke, "stroke-width":1}, g); }
function box(x, y, w, d, h, top, left, right, g){
  const A=iso(x,y,h), B=iso(x+w,y,h), Cc=iso(x+w,y+d,h), D=iso(x,y+d,h), B0=iso(x+w,y), C0=iso(x+w,y+d), D0=iso(x,y+d);
  el("polygon", {points:pts([D,Cc,C0,D0]), fill:left}, g);
  el("polygon", {points:pts([B,Cc,C0,B0]), fill:right}, g);
  el("polygon", {points:pts([A,B,Cc,D]), fill:top}, g);
}
function build(){
  const floor = el("g", {"aria-hidden":"true"});
  for(let x=0;x<N;x++) for(let y=0;y<N;y++) tile(x, y, "#161E40", "#1D2750", floor);      // the ground
  for(let x=7;x<11;x++) for(let y=7;y<11;y++) tile(x, y, "#212B57", "#2D3A72", floor);     // the plaza
  for(const [k,r] of Object.entries(ROOMS)){
    for(let x=r.x;x<r.x+r.w;x++) for(let y=r.y;y<r.y+r.d;y++) tile(x, y, r.floor, r.edge, floor);

function drawTray(){
  const spawnable = Object.entries(CLASSES).filter(([k,c]) => c.spawnable);
  $("#tray").innerHTML = `<span class="lbl">Spawn</span>` + spawnable.map(([k,c]) =>
    `<button class="cls" style="--c:${esc((c.palette||["#8E97C4"])[0])}" onclick="openWizard({class:'${esc(k)}'})" title="${esc(c.about)}"><i>${esc(c.icon)}</i>${esc(c.name)}</button>`).join("");
}
let W = null;
const INTERVALS = [[1200,"every 20 min"],[1800,"every 30 min"],[3600,"every hour"],[7200,"every 2 h"],[14400,"every 4 h"],[21600,"every 6 h"],[43200,"every 12 h"],[86400,"once a day"]];
function openWizard(init){
  const src = init.clone_of ? CAST[init.clone_of] : null;
  const cls = init.class || src?.cls || "scholar", c = CLASSES[cls];
  W = {step: init.clone_of ? 1 : 0, clone_of: init.clone_of || null, class: cls, name: "", key: "", keyEdited: false,
       focus: src ? "" : "", room: c.room, interval: c.interval, cap: c.cap, result: null};
  $("#modal").classList.add("open"); drawWizard();
}
function closeWizard(){ $("#modal").classList.remove("open"); W = null; }
function slug(n){ return n.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,16); }
const STEPS = ["Class", "Identity", "Schedule", "Tools", "Review"];
function drawWizard(){
  const c = CLASSES[W.class], src = W.clone_of ? CAST[W.clone_of] : null;
  let body = "";
  if(W.result){
    body = `<h3 id="wiz-title">${W.result.ok ? "Proposed to the Collective" : "Not proposed"}</h3>
      <p class="note2" style="color:var(--text)">${esc(W.result.ok ? W.result.message : W.result.error)}</p>
      ${W.result.ok ? `<div class="gov">It now appears as a ghost in the ${esc(ROOMS[W.room].label)}. The Collective votes on the motion; once it passes, the agent is activated with <code>spawn.py activate ${esc(W.key || slug(W.name))}</code>, and you decide on its requested tools.</div>` : ""}
      <div class="row">${W.result.ok ? "" : `<button class="btn ghost" onclick="W.result=null;drawWizard()">Back</button>`}<button class="btn" onclick="closeWizard()">Done</button></div>`;
    $("#wiz").innerHTML = body; return;
  }
  const head = `<h3 id="wiz-title">${src ? `Clone ${esc(src.name)}` : "Spawn a new agent"}</h3><div class="note2">Step ${W.step+1} of 5: ${STEPS[W.step]}</div>
    <div class="steps">${STEPS.map((x,i)=>`<span class="${i<=W.step?"on":""}"></span>`).join("")}</div>`;
  if(W.step === 0){
    body = `<div class="choices">${Object.entries(CLASSES).filter(([k,x])=>x.spawnable).map(([k,x]) => `<button class="choice ${k===W.class?"sel":""}" onclick="W.class='${k}';W.room=CLASSES['${k}'].room;W.interval=CLASSES['${k}'].interval;W.cap=CLASSES['${k}'].cap;drawWizard()">
        <b><span>${x.icon}</span>${esc(x.name)}</b><small>${esc(x.about)}</small></button>`).join("")}</div>
      <p class="note2">Officers can't be spawned: each office has exactly one holder (Charter Article 3.7).</p>`;
  } else if(W.step === 1){
    body = `${src?`<p class="note2" style="color:var(--text)">Starting from ${esc(src.name)}: same class (${esc(c.name)}), room, and schedule. Give the clone its own name and focus.</p>`:""}
      <label for="w-name">Name</label><input id="w-name" maxlength="30" value="${esc(W.name)}" placeholder="${c.name === "Verifier" ? "Vera" : "Give it a name"}" oninput="W.name=this.value;if(!W.keyEdited){W.key=slug(this.value);document.getElementById('w-key').value=W.key};refreshNext()">
      <label for="w-key">Key (used for its files and tab)</label><input id="w-key" maxlength="16" value="${esc(W.key)}" oninput="W.key=this.value;W.keyEdited=true">
      <label for="w-focus">Focus: what should it work on?</label><textarea id="w-focus" maxlength="300" oninput="W.focus=this.value;refreshNext()" placeholder="e.g. Fact-check viral health claims using at least two primary sources">${esc(W.focus)}</textarea>
      <label for="w-room">Room</label><select id="w-room" onchange="W.room=this.value">${Object.entries(ROOMS).map(([k,r])=>`<option value="${k}" ${k===W.room?"selected":""}>${r.label}</option>`).join("")}</select>`;
  } else if(W.step === 2){
    const per = Math.min(W.cap, Math.floor(86400 / W.interval));
    body = `<label for="w-int">How often it runs</label><select id="w-int" onchange="W.interval=+this.value;drawWizard()">${INTERVALS.map(([v,l])=>`<option value="${v}" ${v==W.interval?"selected":""}>${l}</option>`).join("")}</select>
      <label for="w-cap">Most runs a day</label><input id="w-cap" type="number" min="1" max="96" value="${W.cap}" oninput="W.cap=Math.max(1,Math.min(96,+this.value||1));document.getElementById('w-per').textContent=Math.min(W.cap, Math.floor(86400/W.interval))">
      <p class="note2">It will run at most <b id="w-per">${per}</b> times a day. Every run costs model usage; the Auditor reports spend by agent daily.</p>`;
  } else if(W.step === 3){
    body = `<p class="note2" style="color:var(--text)">Every new agent starts with base tools only: reading files, searching case law, and posting to the board.</p>
      <label>Starts with</label><div class="chips"><span class="chip2">Reads files</span><span class="chip2">Writes to the board</span><span class="chip2">Case law</span><span class="chip2">Sprints</span><span class="chip2">Projects</span></div>
      <label>Its class requests (only after you ratify them, Article 7.6)</label><div class="chips">${(c.requested||"").split(/,(?![^(]*\))/).filter(Boolean).map(t=>`<span class="chip2 req">${esc(t.replace(/^Bash\(|\)$/g,"").replace(/:\*$/,""))}</span>`).join("") || `<span class="none">Nothing more</span>`}</div>
      <p class="note2">It won't vote. Giving an agent a vote takes a separate amendment you ratify, so the Collective can never vote itself a majority by cloning.</p>`;
  } else {
    body = `<dl class="kv"><dt>Agent</dt><dd><b>${esc(W.name||"(no name)")}</b> (${esc(W.key||slug(W.name))}), ${esc(c.name)}${src?`, cloned from ${esc(src.name)}`:""}</dd>
      <dt>Focus</dt><dd>${esc(W.focus||"(none)")}</dd><dt>Room</dt><dd>${esc(ROOMS[W.room].label)}</dd>
      <dt>Schedule</dt><dd>${INTERVALS.find(([v])=>v==W.interval)?.[1] || W.interval+" s"}, at most ${W.cap} runs a day</dd><dt>Votes</dt><dd>No</dd></dl>
      <div class="gov">This drafts a <b>membership motion</b>, a numbered amendment, rather than creating the agent. It appears as a ghost until the Collective votes. After it passes, it's activated with base tools; its class's extra tools wait for your ratification.</div>`;
  }
  $("#wiz").innerHTML = head + body + `<div class="row"><button class="btn ghost" onclick="closeWizard()">Cancel</button>
    ${W.step > (W.clone_of?1:0) ? `<button class="btn ghost" onclick="W.step--;drawWizard()">Back</button>` : ""}
    ${W.step < 4 ? `<button class="btn" id="w-next" onclick="W.step++;drawWizard()">Next</button>` : `<button class="btn" id="w-propose" onclick="propose()">Propose to the Collective</button>`}</div>
    <p class="note2" id="w-hint"></p>`;
  refreshNext();
  const f = $("#wiz input, #wiz textarea"); if(f && W.step===1) f.focus();
}
function refreshNext(){   // step 2 needs a name and a focus; re-checked as you type
  const b = document.getElementById("w-next"); if(!b || !W) return;
  const ok = W.step !== 1 || (W.name.trim().length >= 2 && W.focus.trim().length >= 10);
  b.disabled = !ok; b.style.opacity = ok ? 1 : .5;
  document.getElementById("w-hint").textContent = ok ? "" : "A name of at least 2 characters and a focus of at least 10.";
}
window.refreshNext = refreshNext;
async function propose(){
  const body = {class: W.class, name: W.name.trim(), key: W.key || slug(W.name), focus: W.focus.trim(), room: W.room, interval: W.interval, cap: W.cap};
  if(W.clone_of) body.clone_of = W.clone_of;
  W.result = await fetch("/api/agents/propose", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)})
    .then(r => r.json()).catch(() => ({error:"The dashboard server didn't respond."}));
  drawWizard(); pollLive().catch(()=>{});
}
window.openWizard = openWizard; window.closeWizard = closeWizard; window.propose = propose;
// ---------- conversations: a chat bubble between the agents who are talking ----------
const TAGC = {proposal:"#A78BFA", decision:"#4FD1C5", amendment:"#A78BFA", incident:"#F07167", opinion:"#C0506A", ruling:"#F2B84B", reopen:"#F2B84B", retro:"#6CC3A0"};
let CONVOS = [], seenCounts = {}, chatOpen = null, CHAT = null;
function who(k){ return k === "steward" ? {name:"You", color:"#0A84FF", icon:"👤"} : CAST[k] ? {name:CAST[k].name, color:CAST[k].color, icon:CAST[k].icon} : {name:k, color:"#8E8E93", icon:"🤖"}; }
function drawChats(){
  $("#chats").innerHTML = ""; $("#links").innerHTML = "";
  // every character's footprint on screen (feet to emblem), so pills never land on anyone
  const bodies = Object.values(AG).filter(a => a.pos).map(a => ({x1:a.pos.x-30, x2:a.pos.x+30, y1:a.pos.y-118, y2:a.pos.y+26}));
  const placed = [];
  const hits = (b) => bodies.concat(placed).some(o => b.x1 < o.x2 && b.x2 > o.x1 && b.y1 < o.y2 && b.y2 > o.y1);
  for(const c of CONVOS.slice(0, 5)){
    const pts = c.participants.filter(k => AG[k]?.pos).map(k => ({k, p:AG[k].pos}));
    if(pts.length < 2) continue;                                   // a chat needs at least two agents on the floor
    const mx = pts.reduce((a,b)=>a+b.p.x,0)/pts.length, my = pts.reduce((a,b)=>a+b.p.y,0)/pts.length - 40;
    const w = 58 + String(c.count).length*9, h = 34;
    // search outward in rings from the midpoint for the nearest spot that covers nobody
    let cx = mx, cy = my, found = false;
    for(let r = 0; r <= 260 && !found; r += 18){
      for(let i = 0; i < (r ? 16 : 1); i++){
        const a = i * Math.PI / 8, dx = r * Math.cos(a) * 1.3, dy = r * Math.sin(a) * .8;
        const b = {x1:mx+dx-w/2-6, x2:mx+dx+w/2+6, y1:my+dy-h/2-6, y2:my+dy+h/2+6};
        if(!hits(b)){ cx = mx+dx; cy = my+dy; found = true; break; }
      }
    }
    placed.push({x1:cx-w/2-6, x2:cx+w/2+6, y1:cy-h/2-6, y2:cy+h/2+6});
    const col = TAGC[c.tag] || "#8E97C4";
    for(const {p} of pts) el("line", {x1:cx, y1:cy, x2:p.x, y2:p.y-20, stroke:col, "stroke-width":1.6, "stroke-dasharray":"2 5", opacity:.7}, $("#links"));
    const fresh = seenCounts[c.id] !== undefined && c.count > seenCounts[c.id];
    const g = el("g", {class:"convo"+(fresh?" fresh":""), tabindex:0, role:"button", transform:`translate(${cx},${cy})`,
                       "aria-label":`Conversation: ${c.title}, between ${c.participants.map(k=>who(k).name).join(", ")}. ${c.count} messages. Open the chat.`}, $("#chats"));
    el("rect", {x:-w/2, y:-h/2, width:w, height:h, rx:h/2, fill:"#F7F8FF", stroke:col, "stroke-width":2.5, class:"pill", filter:"drop-shadow(0 3px 6px rgba(0,0,0,.45))"}, g);
    el("circle", {cx:-w/2+17, cy:0, r:12, fill:col}, g);
    el("path", {d:"M-7,-6 h14 a3,3 0 0 1 3,3 v6 a3,3 0 0 1 -3,3 h-8 l-4,4 v-4 h-2 a3,3 0 0 1 -3,-3 v-6 a3,3 0 0 1 3,-3 z", fill:"#fff", transform:`translate(${-w/2+17},-1)`}, g);
    const t = el("text", {x:w/2-13, y:6, "text-anchor":"end", fill:"#1B2046", "font-family":"Barlow Semi Condensed", "font-size":17, "font-weight":700}, g); t.textContent = c.count;
    const tt = el("title", {}, g); tt.textContent = `${c.title}: ${c.participants.map(k=>who(k).name).join(", ")}`;
    g.addEventListener("click", () => openChat(c.id)); g.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openChat(c.id); } });
  }
}
async function pollConvos(){
  const list = await api("/api/conversations");
  if(!Array.isArray(list)) return;
  for(const c of CONVOS) seenCounts[c.id] = seenCounts[c.id] ?? c.count;
  CONVOS = list; drawChats();
  for(const c of list) if(seenCounts[c.id] === undefined) seenCounts[c.id] = c.count;
  setTimeout(() => { for(const c of list) seenCounts[c.id] = c.count; }, 2600);
  if(chatOpen) loadChat();
}
async function openChat(id){ chatOpen = id; CHAT = null; $("#chatwrap").classList.add("open"); drawChat(); await loadChat(); }
function closeChat(){ chatOpen = null; $("#chatwrap").classList.remove("open"); }
async function loadChat(){ const id = chatOpen; const d = await api(`/api/conversations/${encodeURIComponent(id)}`); if(chatOpen === id){ CHAT = d; drawChat(); } }
function stamp(ts){ const d = new Date(ts), today = new Date().toDateString() === d.toDateString();
  return (today ? "<b>Today</b> " : `<b>${d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"})}</b> `) + d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }
function drawChat(){
  const box = $("#phone");
  if(!CHAT){ box.innerHTML = `<div class="ph-head"><button class="ph-back" onclick="closeChat()">‹ Floor</button><div class="ph-title" style="margin-top:28px">Loading…</div></div><div class="ph-body"></div>`; return; }
  const body = box.querySelector(".ph-body"), atBottom = !body || body.scrollHeight - body.scrollTop - body.clientHeight < 60;
  const items = CHAT.posts.map(p => ({kind:"msg", ...p})).concat((CHAT.doing||[]).map(d => ({kind:"doing", ...d})))
    .sort((a,b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
  let html = "", lastTs = null;
  items.forEach((it, i) => {
    if(!lastTs || new Date(it.ts) - new Date(lastTs) > 15*60*1000) html += `<div class="ph-time">${stamp(it.ts)}</div>`;
    lastTs = it.ts;
    if(it.kind === "doing"){ html += `<div class="ph-doing"><b>${esc(who(it.who).name)}</b> ${esc(it.what)}</div>`; return; }
    const prev = items[i-1], next = items[i+1], me = it.who === "steward", w = who(it.who);
    const first = !prev || prev.kind !== "msg" || prev.who !== it.who, last = !next || next.kind !== "msg" || next.who !== it.who;
    if(first && !me) html += `<div class="ph-name">${esc(w.name)}</div>`;
    html += `<div class="ph-row${me?" me":""}${last?" last":""}">${me?"":`<span class="av ${last?"":"hide"}" style="background:${w.color}40;border:1.5px solid ${w.color}">${w.icon}</span>`}<div class="bub">${esc(it.text)}</div></div>`;
  });
  const typing = (L?.offices || []).filter(o => o.status === "working" && CHAT.participants.includes(o.key));
  for(const o of typing){ const w = who(o.key);
    html += `<div class="ph-name">${esc(w.name)}</div><div class="ph-row last"><span class="av" style="background:${w.color}40;border:1.5px solid ${w.color}">${w.icon}</span><div class="bub typing" aria-label="${esc(w.name)} is working"><i></i><i></i><i></i></div></div>`; }
  const people = CHAT.participants.map(who);
  box.innerHTML = `<div class="ph-head"><button class="ph-back" onclick="closeChat()" aria-label="Back to the floor">‹ Floor</button>
      <div class="ph-avatars">${people.slice(0,4).map(w=>`<span style="background:${w.color}40;border-color:#F9F9F9;box-shadow:0 0 0 1.5px ${w.color} inset">${w.icon}</span>`).join("")}</div>
      <div class="ph-title" id="ph-title">${esc(people.map(w=>w.name).join(", "))}</div>
      <div class="ph-sub">${CHAT.tag?`#${esc(CHAT.tag)} · `:""}${esc(CHAT.title)} · <span class="ph-live"><i></i>live</span></div></div>
    <div class="ph-body" aria-live="polite">${html || `<div class="ph-doing">No messages yet.</div>`}</div>
    <div class="ph-foot"><div class="ph-input">Read-only. Reply on the board or with a #ruling.</div></div>`;
  const nb = box.querySelector(".ph-body"); if(atBottom) nb.scrollTop = nb.scrollHeight;
}
window.closeChat = closeChat;
document.addEventListener("keydown", e => { if(e.key === "Escape" && chatOpen) closeChat(); });
$("#chatwrap").addEventListener("click", e => { if(e.target.id === "chatwrap") closeChat(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && W) closeWizard(); });
function select(k){ selected = k; tab = "bio"; if(k) delete BIO[k]; render(); }
window.select = select;
async function pollLive(){ L = await api("/api/live"); render(); }
async function pollEvents(){
  const ev = await api("/api/events?after=" + (lastSeq ?? 0) + (lastSeq===null ? "&limit=150" : ""));
  if(ev.hidden || !ev.length) return;
  if(lastSeq !== null){ let i=0; for(const e of ev.slice(-10)) if(AG[e.actor]) setTimeout(()=>token(e.actor, e.type==="incident"), 160*i++); }
  EV = EV.concat(ev).slice(-400); lastSeq = ev[ev.length-1].seq; if(L) side();
}
async function pollVerify(){ const v = await api("/api/verify"), bad = v.filter(c=>!c.ok), s = $("#seal");
  s.className = "pill " + (bad.length?"bad":"ok"); s.innerHTML = `<span class="lamp"></span>${bad.length ? `${bad.length} check${bad.length>1?"s":""} failing` : `Verified, ${v.length} of ${v.length}`}`; }
build(); Object.keys(CAST).forEach(k => { CAST[k].cls = {pm:"officer",scribe:"officer",lawyer:"officer",auditor:"officer",researcher:"scholar",ideas:"inventor",prototyper:"artisan",media:"bard",social:"herald"}[k]; makeAgent(k); });
(async () => {
  try { CLASSES = (await api("/api/classes")).classes || {}; drawTray(); } catch(e) {}
  try { await pollLive(); await pollEvents(); } catch(e){ $("#state").innerHTML = `<span class="lamp"></span>Dashboard server not reachable`; }
  pollVerify().catch(()=>{}); setInterval(()=>pollVerify().catch(()=>{}), 60000);
  pollConvos().catch(()=>{});
  setInterval(()=>{ pollLive().catch(()=>{}); pollEvents().catch(()=>{}); pollConvos().catch(()=>{}); }, 2500);
})();
</script>
